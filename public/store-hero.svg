<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Ambient Forge for Owlbear Rodeo</title>
  <desc id="desc">A branded preview of the Ambient Forge synchronized sound scene mixer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0e0b17"/>
      <stop offset="0.56" stop-color="#171225"/>
      <stop offset="1" stop-color="#251533"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9b7cff"/>
      <stop offset="1" stop-color="#ff668a"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#243c46"/>
      <stop offset="1" stop-color="#21352f"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#05030b" flood-opacity=".6"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="36" fill="url(#bg)"/>
  <circle cx="1025" cy="95" r="210" fill="#9b5cff" opacity=".13" filter="url(#glow)"/>
  <circle cx="160" cy="555" r="190" fill="#ff668a" opacity=".10" filter="url(#glow)"/>

  <g transform="translate(70 68)">
    <rect width="76" height="76" rx="22" fill="#171421" stroke="#312a43"/>
    <path d="M20 47h8V31h-8v16zm14 11h8V20h-8v38zm14-6h8V27h-8v25z" fill="url(#accent)"/>
    <circle cx="24" cy="31" r="6" fill="#b59dff"/>
    <circle cx="38" cy="20" r="6" fill="#d881e9"/>
    <circle cx="52" cy="52" r="6" fill="#ff668a"/>
  </g>

  <text x="170" y="104" fill="#ffffff" font-family="Inter,Segoe UI,sans-serif" font-size="44" font-weight="750">Ambient Forge</text>
  <text x="172" y="140" fill="#b9abc9" font-family="Inter,Segoe UI,sans-serif" font-size="20">Synchronized sound scenes for Owlbear Rodeo</text>

  <g transform="translate(70 190)" filter="url(#shadow)">
