      <text x="16" y="110" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700">Crackling Campfire</text>
      <text x="16" y="132" fill="#9d91a9" font-family="Inter,Segoe UI,sans-serif" font-size="13">2 tracks</text>
      <path d="M18 146h202" stroke="#4c4358" stroke-width="4" stroke-linecap="round"/><path d="M18 146h160" stroke="#35c57a" stroke-width="4" stroke-linecap="round"/><circle cx="178" cy="146" r="7" fill="#fff" stroke="#35c57a" stroke-width="3"/>
