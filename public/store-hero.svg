      <circle cx="34" cy="148" r="5" fill="#28d7e5"/><text x="50" y="153" fill="#fff">Beach</text><text x="176" y="153" text-anchor="end" fill="#a89ab7">3</text>
      <circle cx="34" cy="194" r="5" fill="#2f8e22"/><text x="50" y="199" fill="#d8cfdf">Forest</text><text x="176" y="199" text-anchor="end" fill="#81758e">4</text>
